name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Al-Baqarah  2. ..."
  - type: input
    id: version
    attributes:
      label: App version and system
      placeholder: "0.0.4-beta, Windows 11 / macOS 15"
    validations:
      required: true
  - type: dropdown
    id: online
    attributes:
      label: Were you online?
      options: ["Yes", "No (offline)", "Not sure"]

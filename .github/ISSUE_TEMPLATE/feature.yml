name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
      description: Describe the feature in a few sentences.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do that is hard or impossible today?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Reading", "Listening / reciters", "Translations", "Search and bookmarks", "Settings and look", "Windows / macOS / Linux integration", "Other"]
  - type: input
    id: version
    attributes:
      label: App version and system (optional)
      placeholder: "0.0.6-beta, Windows 11 / macOS 15 / Fedora"

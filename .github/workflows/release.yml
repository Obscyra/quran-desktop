name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
          # the oldest runner on offer, so the AppImage runs on as many distributions as possible
          - os: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux libraries Tauri needs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pulseaudio

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Require the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set. In-app updates need it; see README (Releases)."
            exit 1
          fi

      - name: Take the app version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('fs');
            const p = 'app/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = '$VERSION';
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\n');
          "

      - run: npm ci
        working-directory: app

      - name: Bundle the Quran text and page fonts
        run: node scripts/bundle-data.mjs
        working-directory: app

      - name: Compose the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            if [ -f ".github/release-notes/${GITHUB_REF_NAME}.md" ]; then
              cat ".github/release-notes/${GITHUB_REF_NAME}.md"
            else
              echo "Release ${GITHUB_REF_NAME}."
            fi
            cat .github/release-notes/footer.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'Quran ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # Installed apps read releases/latest/download/latest.json, and GitHub's "latest" skips
          # pre-releases. Beta builds are therefore published as normal releases (the version in the
          # tag, such as -beta, still says what they are) so in-app updates can find them.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # An RPM version cannot contain a hyphen, so 0.0.5-beta cannot be packaged as it is. Build the RPM in a second
      # pass with the version split the way Fedora names pre-releases: version 0.0.5, release 0.beta.1 (sorts before
      # the final 0.0.5-1). Not part of the app's own updater: RPM users download new versions.
      - name: Build the .rpm
        if: matrix.os == 'ubuntu-22.04'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BASE="${FULL%%-*}"
          RELEASE=1
          if [ "$FULL" != "$BASE" ]; then RELEASE="0.${FULL#*-}.1"; fi
          npx tauri build --bundles rpm --config "{\"version\":\"$BASE\",\"bundle\":{\"createUpdaterArtifacts\":false,\"linux\":{\"rpm\":{\"release\":\"$RELEASE\",\"depends\":[\"webkit2gtk4.1\",\"gtk3\",\"libappindicator-gtk3\"]}}}}"
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/rpm/*.rpm --clobber

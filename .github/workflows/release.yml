name: Release

on:
  push:
    tags: ['v*']
  # Run by hand to build one platform for a tag (a release is created for the tag if it does not exist):
  #   gh workflow run release.yml -f tag=v0.0.6-beta -f only=macos
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and publish (for example v0.0.6-beta)'
        required: true
      only:
        description: 'One platform: windows, macos or linux (empty: all three)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - id: m
        env:
          ONLY: ${{ inputs.only }}
        run: |
          node -e "
            // ubuntu-22.04 is the oldest runner on offer, so the AppImage runs on as many distributions as possible
            const all = [
              { os: 'windows-latest', args: '' },
              { os: 'macos-latest', args: '--target universal-apple-darwin' },
              { os: 'ubuntu-22.04', args: '' }
            ];
            const only = (process.env.ONLY || '').trim().toLowerCase().replace(/^linux\$/, 'ubuntu');
            const list = only ? all.filter((r) => r.os.startsWith(only)) : all;
            if (!list.length) { console.error('Unknown platform: ' + only); process.exit(1); }
            console.log('matrix=' + JSON.stringify(list));
          " >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      # Betas (a hyphen in the tag) are built with the quick profile: no link-time optimisation, 16 code units in parallel.
      # Cargo.toml keeps lto = true and codegen-units = 1 for stable releases, whose last compile step is slow and single-threaded.
      CARGO_PROFILE_RELEASE_LTO: ${{ contains(inputs.tag || github.ref_name, '-') && 'false' || 'true' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ contains(inputs.tag || github.ref_name, '-') && '16' || '1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the Linux libraries Tauri needs
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pulseaudio
          # WebKit here uses libsoup 3; the webrtc plugin pulls in libsoup 2 and aborts the web process ("Failed to load surah")
          sudo rm -f /usr/lib/x86_64-linux-gnu/gstreamer-1.0/libgstwebrtc.so

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: app/src-tauri
          # A cache saved by a run on a tag cannot be read by a later tag, only the default branch's cache can. So the cache is
          # saved by runs on main (start releases with: gh workflow run release.yml --ref main -f tag=vX.Y.Z) and every tag restores it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Require the updater signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set. In-app updates need it; see README (Releases)."
            exit 1
          fi

      - name: Take the app version from the tag
        if: startsWith(env.TAG, 'v')
        shell: bash
        run: |
          # the tag name goes in as data (an environment variable), never into the script text
          node -e "
            const fs = require('fs');
            const p = 'app/src-tauri/tauri.conf.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.version = process.env.TAG.replace(/^v/, '');
            fs.writeFileSync(p, JSON.stringify(c, null, 2) + '\\n');
          "

      - run: npm ci
        working-directory: app

      - name: Bundle the Quran text and page fonts
        run: node scripts/bundle-data.mjs
        working-directory: app

      - name: Compose the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<NOTES_EOF'
            if [ -f ".github/release-notes/${TAG}.md" ]; then
              cat ".github/release-notes/${TAG}.md"
            else
              echo "Release ${TAG}."
            fi
            cat .github/release-notes/footer.md
            echo 'NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ env.TAG }}
          releaseName: 'Quran ${{ env.TAG }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          # Installed apps read releases/latest/download/latest.json, and GitHub's "latest" skips
          # pre-releases. Beta builds are therefore published as normal releases (the version in the
          # tag, such as -beta, still says what they are) so in-app updates can find them.
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # An RPM version cannot contain a hyphen, so 0.0.5-beta cannot be packaged as it is. Build the RPM in a second
      # pass with the version split the way Fedora names pre-releases: version 0.0.5, release 0.beta.1 (sorts before
      # the final 0.0.5-1). Not part of the app's own updater: RPM users download new versions.
      - name: Build the .rpm
        if: matrix.os == 'ubuntu-22.04'
        working-directory: app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FULL=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BASE="${FULL%%-*}"
          RELEASE=1
          if [ "$FULL" != "$BASE" ]; then RELEASE="0.${FULL#*-}.1"; fi
          npx tauri build --bundles rpm --config "{\"version\":\"$BASE\",\"bundle\":{\"createUpdaterArtifacts\":false,\"linux\":{\"rpm\":{\"release\":\"$RELEASE\",\"depends\":[\"webkit2gtk4.1\",\"gtk3\",\"libappindicator-gtk3\"]}}}}"
          gh release upload "$TAG" src-tauri/target/release/bundle/rpm/*.rpm --clobber
